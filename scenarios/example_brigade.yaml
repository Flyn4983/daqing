# 旅级示例想定（C7-a0 合成兵种版）：
# 红方重型合成旅加强攻击群：2 个合成营突击 + 炮兵群/防空群/预警侦察电抗群/
# 保障战斗实体 + 无人机/巡飞弹/武直空中架次（约 106 个地面实体）；
# 蓝方合成化防御群：既设阵地 + 障碍带 + 伪装假目标 + 炮兵/防空/电抗/空中架次（约 57 个）。
# 任务：占领进攻出发阵地 → 突破河障前沿（须工兵破障、发烟车遮蔽）→ 夺占纵深要点。
# 数值均为原型占位（confidence 0.3-0.5），等待真实数据资产替换。
name: example_brigade

mission:
  duration_ticks: 72       # 72 * 30s ≈ 36 分钟（开进—破障—突破纵深完整时序）
  dt_seconds: 30
  objective: [9000, 5000]
  success_radius_m: 500
  phases:
    - {name: "占领进攻出发阵地", objective: [2800, 5000], success_radius_m: 400}
    - {name: "强渡峡谷突破前沿", objective: [6000, 5000], success_radius_m: 500}
    - {name: "夺占纵深要点", objective: [9000, 5000], success_radius_m: 500}

terrain:
  source: geotiff
  geotiff_path: terrain/dem_demo.tif
  passability_path: terrain/dem_pass.tif
  size_m: [10000, 10000]
  grid_n: 65
  water_level: 5.0

environment:
  weather: clear
  illumination: day
  visibility_factor: 1.0
  wind_speed_mps: 3.0
  wind_dir_deg: 270

# 方别不对称：蓝方既设防御火力加成
side_modifiers:
  blue: {pk_scale: 1.000}

platform_types:
  # ============ 突击力量 ============
  tank:
    sensor_range_m: 2500
    weapon_range_m: 2000
    pk: 0.35
    speed_m_per_tick: 184
    sensor_kind: ir          # 坦克热像，夜间仍有战力
    meta: {source: example, version: "0.5", confidence: 0.4}
  ifv:
    sensor_range_m: 1800
    weapon_range_m: 1200
    pk: 0.22
    speed_m_per_tick: 217
    sensor_kind: optical
    meta: {source: example, version: "0.5", confidence: 0.4}
  atgm_team:
    sensor_range_m: 2200
    weapon_range_m: 2000
    pk: 0.45
    speed_m_per_tick: 100
    sensor_kind: optical
    meta: {source: example, version: "0.5", confidence: 0.4}

  # ============ 火力打击群（间瞄/超视距） ============
  mortar:                    # 营属 120 自行迫击炮
    role: artillery
    fire_mode: indirect
    sensor_range_m: 900
    weapon_range_m: 3500
    pk: 0.15
    speed_m_per_tick: 70
    reload_ticks: 3
    splash_radius_m: 200
    call_fire_delay_ticks: 1
    emplace_ticks: 1
    ammo_basic_load: 8
    sensor_kind: optical
  howitzer:                  # PLZ-07 122 自行榴弹炮
    role: artillery
    fire_mode: indirect
    sensor_range_m: 600
    weapon_range_m: 8000
    pk: 0.18
    speed_m_per_tick: 0
    reload_ticks: 3
    splash_radius_m: 300
    call_fire_delay_ticks: 3
    emplace_ticks: 2
    ammo_basic_load: 12
    sensor_kind: optical
  rocket:                    # PHL-11 122 火箭炮（大面积、少量齐射）
    role: artillery
    fire_mode: indirect
    sensor_range_m: 500
    weapon_range_m: 9000
    pk: 0.22
    speed_m_per_tick: 0
    reload_ticks: 6
    splash_radius_m: 550
    call_fire_delay_ticks: 3
    emplace_ticks: 2
    ammo_basic_load: 2
    sensor_kind: optical
  hj10:                      # 红箭-10 超视距导弹车（需目标指示链）
    role: missile
    fire_mode: blos
    sensor_range_m: 1200
    weapon_range_m: 10000
    pk: 0.70
    speed_m_per_tick: 0
    reload_ticks: 2
    call_fire_delay_ticks: 1
    emplace_ticks: 1
    ammo_basic_load: 8
    sensor_kind: ir

  # ============ 防空群 ============
  hq17:                      # 红旗-17 近程防空导弹
    role: air_defense
    fire_mode: air_defense
    sensor_range_m: 1500
    weapon_range_m: 5500
    coverage_radius_m: 5500
    pk: 0.7
    speed_m_per_tick: 0
    reload_ticks: 2
    emplace_ticks: 1
    ammo_basic_load: 6
    sensor_kind: radar
  pgz09:                     # 双35 自行高炮（末端反无人）
    role: air_defense
    fire_mode: air_defense
    sensor_range_m: 1200
    weapon_range_m: 2500
    coverage_radius_m: 2500
    pk: 0.6
    speed_m_per_tick: 0
    reload_ticks: 1
    emplace_ticks: 1
    ammo_basic_load: 30
    sensor_kind: radar

  # ============ 预警侦察与电磁对抗群 ============
  radar_air:                 # 对空警戒雷达
    role: radar_air
    sensor_range_m: 500
    weapon_range_m: 0
    coverage_radius_m: 12000
    emission_duty: 0.7
    emplace_ticks: 1
    pk: 0.0
    speed_m_per_tick: 0
    sensor_kind: radar
  radar_cb:                  # 反炮兵定位雷达
    role: radar_cb
    sensor_range_m: 300
    weapon_range_m: 0
    coverage_radius_m: 9000
    emission_duty: 0.8
    emplace_ticks: 1
    pk: 0.0
    speed_m_per_tick: 0
    sensor_kind: radar
  recon_veh:                 # 装甲侦察车（雷达+光电融合）
    role: recon
    sensor_range_m: 3200
    weapon_range_m: 1200
    pk: 0.15
    speed_m_per_tick: 200
    reload_ticks: 3
    sensor_kind: fused
  ew_radar:                  # 雷达对抗车
    role: ew
    jam_mode: radar
    sensor_range_m: 400
    weapon_range_m: 0
    coverage_radius_m: 6000
    jam_strength: 0.8
    emplace_ticks: 1
    pk: 0.0
    speed_m_per_tick: 0
  ew_comms:                  # 通信对抗车
    role: ew
    jam_mode: comms
    sensor_range_m: 400
    weapon_range_m: 0
    coverage_radius_m: 5000
    jam_strength: 0.8
    emplace_ticks: 1
    pk: 0.0
    speed_m_per_tick: 0
  ew_gen:                    # 旅通用电抗车
    role: ew
    jam_mode: both
    sensor_range_m: 400
    weapon_range_m: 0
    coverage_radius_m: 3500
    jam_strength: 0.5
    pk: 0.0
    speed_m_per_tick: 60
  c2_veh:                    # 指挥通信车
    role: c2
    sensor_range_m: 800
    weapon_range_m: 0
    coverage_radius_m: 2600
    aura_bonus: 0.12
    pk: 0.0
    speed_m_per_tick: 100

  # ============ 工程防化与保障车辆 ============
  eng_veh:                   # 综合扫雷破障车
    role: engineer
    sensor_range_m: 400
    weapon_range_m: 0
    pk: 0.0
    speed_m_per_tick: 130
  smoke_veh:                 # 发烟车
    role: support
    sensor_range_m: 300
    weapon_range_m: 0
    pk: 0.0
    speed_m_per_tick: 110
  arv:                       # 装甲抢救车
    role: support
    sensor_range_m: 300
    weapon_range_m: 0
    pk: 0.0
    speed_m_per_tick: 150
  repair_veh:                # 装甲抢修车（营中继修理点）
    role: support
    sensor_range_m: 300
    weapon_range_m: 0
    pk: 0.0
    speed_m_per_tick: 60
  supply_veh:                # 器材补给车
    role: support
    sensor_range_m: 300
    weapon_range_m: 0
    pk: 0.0
    speed_m_per_tick: 90
  ammo_veh:                  # 弹药补给车
    role: support
    sensor_range_m: 300
    weapon_range_m: 0
    pk: 0.0
    speed_m_per_tick: 90
  dummy_arty:                # 假火炮/假阵地（伪装欺骗，消耗精确弹药）
    role: artillery
    fire_mode: support
    sensor_range_m: 100
    weapon_range_m: 0
    pk: 0.0
    speed_m_per_tick: 0

sustainment:
  repair_teams: {red: 6, blue: 4}
  repair_delay_ticks: 0
  spare_stock: {red: 12, blue: 8}
  resupply_interval_ticks: 20
  resupply_qty: 8
  repair_station: {red: [1500, 5000], blue: [9500, 5100]}

# ---- 蓝方障碍带：掩护河障接近地的雷场/三角锥/反坦克壕，须工兵破障 ----
battlefield:
  obstacles:
    - {kind: dragons_teeth, center: [5750, 5000], size: [220, 280], breach_ticks: 6}
    - {kind: minefield, center: [5800, 4250], size: [200, 420], breach_ticks: 6}
    - {kind: minefield, center: [5800, 5750], size: [200, 420], breach_ticks: 6}
    - {kind: anti_tank_ditch, center: [5900, 2600], size: [200, 600], breach_ticks: 8}
  smoke_orders:
    # 双车在突破走廊南北各设一道屏烟，遮蔽一线反坦克导弹班与装甲发射点
    - {unit_id: rsm01, at: [5400, 4350], radius_m: 750, start_tick: 6, duration_ticks: 16}
    - {unit_id: rsm02, at: [5400, 5650], radius_m: 750, start_tick: 6, duration_ticks: 16}

# ---- 空中架次：UAV 开视野/校射，巡飞弹打节点，武直近距支援 ----
air_packages:
  # 红方
  - {side: red, kind: uav, launch_tick: 4, altitude_m: 1500, loiter_ticks: 16,
     waypoints: [[3500, 3000], [5400, 3200]], sensor_range_m: 3000, sensor_kind: fused,
     label: "红·侦察校射无人机1"}
  - {side: red, kind: uav, launch_tick: 8, altitude_m: 1500, loiter_ticks: 16,
     waypoints: [[3500, 7000], [5400, 6800]], sensor_range_m: 3000, sensor_kind: fused,
     label: "红·侦察校射无人机2"}
  - {side: red, kind: loitering, launch_tick: 14, altitude_m: 900, loiter_ticks: 4,
     waypoints: [[4000, 4200], [7600, 4200]], seek_radius_m: 1900,
     weapon_pk: 0.75, weapon_count: 1, label: "红·巡飞弹1（反辐射/节点猎杀）"}
  - {side: red, kind: loitering, launch_tick: 20, altitude_m: 900, loiter_ticks: 4,
     waypoints: [[4000, 6000], [7600, 6200]], seek_radius_m: 1900,
     weapon_pk: 0.75, weapon_count: 1, label: "红·巡飞弹2"}
  - {side: red, kind: helo, launch_tick: 24, altitude_m: 400, loiter_ticks: 6,
     waypoints: [[3000, 1800], [6600, 2800]], seek_radius_m: 2100,
     weapon_pk: 0.35, weapon_count: 4, label: "红·直-10 近距支援"}
  # 蓝方
  - {side: blue, kind: uav, launch_tick: 3, altitude_m: 1500, loiter_ticks: 16,
     waypoints: [[6500, 2600], [3600, 2400]], sensor_range_m: 2800, sensor_kind: fused,
     label: "蓝·侦察无人机1"}
  - {side: blue, kind: uav, launch_tick: 9, altitude_m: 1500, loiter_ticks: 16,
     waypoints: [[6500, 7400], [3600, 7600]], sensor_range_m: 2800, sensor_kind: fused,
     label: "蓝·侦察无人机2"}
  - {side: blue, kind: loitering, launch_tick: 12, altitude_m: 900, loiter_ticks: 4,
     waypoints: [[7000, 1500], [900, 1400]], seek_radius_m: 2100,
     weapon_pk: 0.8, weapon_count: 1, label: "蓝·反辐射巡飞弹1（猎杀雷达）"}
  - {side: blue, kind: loitering, launch_tick: 18, altitude_m: 900, loiter_ticks: 4,
     waypoints: [[7000, 5000], [700, 5000]], seek_radius_m: 2200,
     weapon_pk: 0.8, weapon_count: 1, label: "蓝·巡飞弹2（猎杀指挥/炮兵）"}
  - {side: blue, kind: helo, launch_tick: 26, altitude_m: 400, loiter_ticks: 6,
     waypoints: [[7000, 8200], [3400, 5200]], seek_radius_m: 2200,
     weapon_pk: 0.4, weapon_count: 5, label: "蓝·武装直升机"}

