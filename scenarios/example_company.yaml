    - {unit_id: r-i3, type: ifv,  pos: [0, 5300]}
    - {unit_id: r-i4, type: ifv,  pos: [0, 5700]}
  blue:
    - {unit_id: b-a1, type: atgm_team, pos: [7600, 4200]}
    - {unit_id: b-a2, type: atgm_team, pos: [7600, 5000]}
    - {unit_id: b-a3, type: atgm_team, pos: [7600, 5800]}
    - {unit_id: b-t1, type: tank, pos: [8200, 4600]}
    - {unit_id: b-t2, type: tank, pos: [8200, 5400]}
