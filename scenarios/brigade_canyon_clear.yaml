# C7-b：峡谷清晰攻坚——example_brigade 换 terrain=preset canyon（深切 FBM + 中间走廊 + 两侧 0.7 + 边缘 0.4）
# 蓝方在峡谷出口既设，红方从入口突破。难点：通行 mean 0.69 + 地形遮蔽 visibility 0.85
name: brigade_canyon_clear

mission:
  duration_ticks: 96
  dt_seconds: 30
  objective: [9000, 5000]
  success_radius_m: 600

terrain:
  preset_family: canyon
  size_m: [10000, 10000]
  grid_n: 65

environment:
  weather: clear
  illumination: day
  visibility_factor: 0.85    # canyon 遮蔽，光电降 15%，雷达不受影响

# 直接引用 example_brigade 的 platform_types/forces——用 provider 代码加载
# （让 medium_brigade 的 platform_types 先跑通再扩写；这里用内联简化版先冒烟）
