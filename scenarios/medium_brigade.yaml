    - unit_id: r_i2
      type: wheel_ifv
      pos: [1100, 5600]
    - unit_id: r_r1
      type: wheel_recon
      pos: [500, 4800]
    - unit_id: r_r2
      type: wheel_recon
      pos: [500, 5200]
    - unit_id: r_h1
      type: wheel_howitzer
      pos: [600, 4000]
    - unit_id: r_h2
      type: wheel_howitzer
      pos: [600, 6000]
    - unit_id: r_s1
      type: wheel_sam
      pos: [1200, 4500]
    - unit_id: r_s2
      type: wheel_sam
      pos: [1200, 5500]
    - unit_id: r_e1
      type: wheel_ew
      pos: [1500, 5000]

  blue:
    - unit_id: b_t1
      type: tank               # 蓝方仍用重型坦克（不对称：重型 vs 中型快攻）
      pos: [5000, 4000]
    - unit_id: b_t2
      type: tank
      pos: [5000, 4500]
    - unit_id: b_t3
